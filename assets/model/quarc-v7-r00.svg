<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">QuARC V7 — R00 full-perception baseline</title><desc id="diagram-desc">Three-view RGB clips pass through frozen DINO and 24 Omega pairs. All final image tokens and 64 scene tokens form decoder evidence. A sampled pre-Omega DINO feature and a spacetime query form the query token. Eight cross-attention blocks predict XYZ, confidence and visibility.</desc><defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#687780" stroke-width="1.3"/></marker>
<symbol id="patch-grid" viewBox="0 0 66 66"><rect x="0" y="0" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="17" y="0" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="34" y="0" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="51" y="0" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="0" y="17" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="17" y="17" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="34" y="17" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="51" y="17" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="0" y="34" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="17" y="34" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="34" y="34" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="51" y="34" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="0" y="51" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="17" y="51" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="34" y="51" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/><rect x="51" y="51" width="13" height="13" rx="1" fill="#bad4df" stroke="#5c8da0" stroke-width=".6"/></symbol>
<symbol id="tail-row" viewBox="0 0 134 16"><rect x="0" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="17" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="34" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="51" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="68" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="85" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="102" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/><rect x="119" width="13" height="13" rx="1" fill="#dcd1ec" stroke="#8d75ab" stroke-width=".6"/></symbol>
<symbol id="frame" viewBox="0 0 138 90"><rect x="1" y="1" width="136" height="88" fill="#e7ecee" stroke="#8899a1"/><path d="M1 68L45 40L77 57L109 26L137 51V89H1Z" fill="#c0ced1"/><path d="M16 76H119M46 76V56H90V76" fill="none" stroke="#81979a" stroke-width="3"/><circle cx="84" cy="51" r="5" fill="#bc7f63"/></symbol>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24343c} .title{font-size:22px;font-weight:600}.label{font-size:16px}.small{font-size:13px;fill:#64747c}.tiny{font-size:12px;fill:#64747c}.mono{font-family:monospace;font-size:14px}.wire{fill:none;stroke:#687780;stroke-width:1.7;marker-end:url(#arrow)}.frozen{fill:#eaf0f3;stroke:#8fa5ae;stroke-width:1.4}.learned{fill:#edf4ed;stroke:#7b9b81;stroke-width:1.4}.tail{fill:#f2edf7;stroke:#9c88b3;stroke-width:1.4}</style>
<rect width="1320" height="620" fill="#fff"/>
<g id="encoder-lane"><rect x="22" y="24" width="1276" height="296" fill="#f6f8f9"/>
<text x="42" y="57" class="title">Full-clip encoder</text><text x="1274" y="55" text-anchor="end" class="small">16 frames × 3 views · 1,024 channels</text>
<g id="rgb-input"><use href="#frame" x="49" y="103" width="138" height="90"/><use href="#frame" x="64" y="116" width="138" height="90"/><use href="#frame" x="79" y="129" width="138" height="90"/><text x="131" y="248" text-anchor="middle" class="label">RGB clip</text><text x="131" y="273" text-anchor="middle" class="small">native resolution</text></g>
<path d="M226 172H266" class="wire"/>
<g id="dino"><rect x="276" y="96" width="154" height="147" class="frozen" rx="3"/><text x="353" y="132" text-anchor="middle" class="title">DINOv3-L</text><text x="353" y="159" text-anchor="middle" class="label">24 ViT blocks</text><text x="353" y="186" text-anchor="middle" class="small">16 × 16 patches</text><text x="353" y="218" text-anchor="middle" class="small">FROZEN</text></g>
<path d="M432 172H488" class="wire"/>
<g id="omega-pairs"><rect x="501" y="89" width="478" height="170" rx="3" fill="#fff" stroke="#b3c1c7"/><text x="522" y="118" class="label">VGGT-Omega</text><text x="956" y="118" text-anchor="end" class="small">× 24 pairs</text>
<rect x="521" y="139" width="157" height="93" class="frozen" rx="2"/><text x="599" y="166" text-anchor="middle" class="label">Within-frame</text><text x="599" y="190" text-anchor="middle" class="label">attention + FFN</text><text x="599" y="216" text-anchor="middle" class="tiny">FROZEN</text>
<path d="M685 185H719" class="wire"/>
<rect x="729" y="139" width="228" height="93" class="learned" rx="2"/><text x="843" y="166" text-anchor="middle" class="label">Inter-frame attention + FFN</text><text x="843" y="192" text-anchor="middle" class="small">19 global · 5 register-only</text><text x="843" y="216" text-anchor="middle" class="tiny">ALL 24 TRAINABLE</text>
<text x="740" y="285" text-anchor="middle" class="small">+ view/time conditioning at pairs 0, 8, 17, 23</text></g>
<path d="M981 172H1023" class="wire"/>
<g id="packed-evidence" data-path="kv"><use href="#patch-grid" x="1046" y="120" width="63" height="63"/><use href="#patch-grid" x="1060" y="133" width="63" height="63"/><use href="#patch-grid" x="1074" y="146" width="63" height="63"/><use href="#tail-row" x="1147" y="153" width="119" height="15"/><use href="#tail-row" x="1147" y="175" width="119" height="15"/><text x="1095" y="236" text-anchor="middle" class="small">all image rows</text><text x="1207" y="236" text-anchor="middle" class="small">64 scene rows</text><text x="1150" y="272" text-anchor="middle" class="label">Final packed context</text></g></g>
<g id="scene-tail-input"><use href="#tail-row" x="504" y="53" width="116" height="14"/><text x="632" y="64" class="small">+ 64 learned scene tokens per clip</text></g>
<g id="query-path" data-path="q"><path d="M353 245V364H458V405" class="wire" stroke-dasharray="5 4"/><text x="369" y="350" class="small">sample source patch feature</text><text x="369" y="383" class="tiny">pre-Omega DINO · bilinear · Q only</text>
<rect x="48" y="418" width="242" height="104" fill="#fbf4e9" stroke="#bca588" stroke-width="1.4" rx="3"/><text x="69" y="449" class="title">Point query</text><text x="69" y="478" class="mono">(u, v, t_src, v_src,</text><text x="69" y="501" class="mono"> t_tgt, t_cam, v_cam)</text>
<path d="M292 469H358" class="wire"/><rect x="368" y="418" width="183" height="104" class="learned" rx="3"/><text x="459" y="449" text-anchor="middle" class="label">Query embedding</text><text x="459" y="476" text-anchor="middle" class="small">source + UV + time</text><text x="459" y="500" text-anchor="middle" class="small">+ view embeddings</text><path d="M554 469H642" class="wire"/><text x="595" y="455" text-anchor="middle" class="label">Q</text></g>
<g id="evidence-path" data-path="kv"><path d="M1153 295V350H826V405" class="wire"/><text x="1000" y="373" text-anchor="middle" class="small">K / V · every final image + scene row</text></g>
<g id="point-decoder"><rect x="658" y="410" width="286" height="120" fill="#dce8df" stroke="#9cae9d"/><rect x="650" y="418" width="286" height="120" class="learned" rx="3"/><text x="675" y="449" class="title">Point decoder</text><text x="910" y="449" text-anchor="end" class="label">× 8</text><text x="675" y="477" class="label">Cross-attention → FFN</text><text x="675" y="503" class="small">16 heads · no query self-attention</text></g>
<path d="M940 477H994" class="wire"/><g id="point-head"><rect x="1004" y="418" width="270" height="120" fill="#faf1ed" stroke="#bfa492" stroke-width="1.4" rx="3"/><text x="1026" y="450" class="title">5-channel point head</text><text x="1026" y="479" class="label">XYZ in the requested camera</text><text x="1026" y="506" class="small">confidence logit · visibility logit</text></g>
<text x="48" y="582" class="small">R00: scene tokens interact with visual context and remain visible to the decoder. Ray-loss weight = 0.</text>
</svg>